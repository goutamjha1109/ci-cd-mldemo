name: CI_Demo

on:
  push:
    branches: [master]

jobs:
  train_and_validate:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc
      - name: Run DVC Repro
        run: dvc repro

      - name: Compare metrics
        run: dvc metrics diff HEAD~1 || true
       
