stages :
  data_preparation:
    cmd : python src/data_prep.py --config config/params.yaml
    deps:
      - src/data_prep.py
      - config/params.yaml
    params:
      - config/params.yaml:
          - data 
    outs:
      - data/churn.csv

  train:
    cmd : python src/train.py --config config/params.yaml
    deps:
      - src/train.py
      - config/params.yaml
      - data/churn.csv 
    params:
      - config/params.yaml:
          - data
          - model
    outs:
      - model/model.pkl
    metrics:
      - metrics/metrics.json:
          cache: false